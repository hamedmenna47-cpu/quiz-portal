<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Quiz Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="card p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-dark p-3 rounded-circle border border-secondary mb-2" style="width: 60px; height: 60px;">
              <i class="bi bi-shield-lock-fill fs-3 text-purple"></i>
            </div>
            <h3 class="fw-bold text-purple mb-1">Student Portal</h3>
            <p class="text-secondary small">Enter credentials to proceed</p>
          </div>

          <div id="loginAlert" class="alert d-none py-2" role="alert"></div>

          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="loginEmail" placeholder="name@example.com" required>
            </div>
            <div class="mb-3">
              <div class="d-flex justify-content-between"><label class="form-label">Password</label><a href="#" class="small text-purple text-decoration-none" id="forgotPasswordLink">Forgot?</a></div>
              <div class="input-group">
                <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
                <button class="btn btn-outline-secondary border-start-0 text-light" type="button" id="toggleLoginPassword"><i class="bi bi-eye-slash" id="toggleLoginIcon"></i></button>
              </div>
            </div>
            <button type="submit" id="loginBtn" class="btn btn-purple w-100 py-2 mt-2">Sign In</button>
          </form>
          <div class="text-center mt-4"><p class="small text-secondary mb-0">Need an account? <a href="register.html" class="text-purple fw-bold text-decoration-none">Register</a></p></div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
