<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container my-4">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8 col-xl-7">
        <div class="card p-4 p-md-5">
          <div class="text-center mb-4">
            <h2 class="text-purple fw-bold mb-1">Welcome Back</h2>
            <p class="text-secondary small">Access your assessment dashboard</p>
          </div>
          <form id="loginForm">
            <div class="mb-3">
              <label for="loginEmail" class="form-label">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-transparent border-secondary text-secondary"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="loginEmail" placeholder="student@example.com" required>
              </div>
            </div>
            <div class="mb-4">
              <label for="loginPassword" class="form-label">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-transparent border-secondary text-secondary"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
              </div>
            </div>
            <div id="loginError" class="text-danger small mb-3 text-center"></div>
            <button type="submit" class="btn btn-purple w-100 py-2.5 mb-3">Login to Portal</button>
            <div class="text-center">
              <span class="text-secondary small">Don't have an account? </span>
              <a href="register.html" class="text-purple text-decoration-none small fw-bold">Register here</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
