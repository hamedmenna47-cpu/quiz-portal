<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Session</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container my-4">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-7">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div>
            <span class="text-secondary small d-block">Candidate</span>
            <h5 class="m-0 text-purple fw-bold" id="studentNameDisplay">Student</h5>
          </div>
          <div class="d-flex align-items-center">
            <span class="badge bg-danger px-3 py-2 fs-6 me-3 rounded-pill" id="timerDisplay"><i class="bi bi-clock me-1"></i>15:00</span>
            <button class="btn btn-outline-danger btn-sm rounded-pill px-3" onclick="handleLogout()">Logout</button>
          </div>
        </div>

        <div class="card p-4 p-md-5">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="fw-bold text-secondary">Question <span id="currentQNum" class="text-light">1</span> / <span id="totalQNum">10</span></span>
          </div>
          <div class="progress mb-4" style="height: 6px;"><div id="progressBar" class="progress-bar progress-bar-purple" style="width: 0%;"></div></div>
          
          <div id="quizError" class="text-danger small mb-2"></div>
          <div id="questionContainer"></div>
          
          <div class="d-flex gap-2 mt-4">
            <button id="prevBtn" class="btn btn-prev-neon w-50 py-2 d-none"><i class="bi bi-arrow-left me-1"></i> Previous</button>
            <button id="nextBtn" class="btn btn-purple w-100 py-2">Next Question <i class="bi bi-arrow-right ms-1"></i></button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
