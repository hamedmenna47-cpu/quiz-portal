<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal - Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container my-4">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8 col-xl-7">
        <div class="card p-4 p-md-5">
          <div class="text-center mb-4">
            <h2 class="text-purple fw-bold mb-1">Create Account</h2>
            <p class="text-secondary small">Register to take academic assessments</p>
          </div>
          <form id="registerForm">
            <div class="mb-3">
              <label for="regName" class="form-label">Full Name</label>
              <div class="input-group">
                <span class="input-group-text bg-transparent border-secondary text-secondary"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="regName" placeholder="e.g. Menna Ahmed" required>
              </div>
            </div>
            <div class="mb-3 position-relative">
              <label for="regEmail" class="form-label">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-transparent border-secondary text-secondary"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="regEmail" placeholder="Type username or name..." autocomplete="off" required>
              </div>
              <div id="emailSuggestBox" class="position-absolute w-100 d-none mt-1 z-3"></div>
            </div>
            <div class="mb-4">
              <label for="regPassword" class="form-label">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-transparent border-secondary text-secondary"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="regPassword" placeholder="Minimum 6 characters" required>
              </div>
            </div>
            <div id="regError" class="text-danger small mb-3 text-center"></div>
            <button type="submit" class="btn btn-purple w-100 py-2.5 mb-3">Register Account</button>
            <div class="text-center">
              <span class="text-secondary small">Already registered? </span>
              <a href="index.html" class="text-purple text-decoration-none small fw-bold">Login here</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
