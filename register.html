<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Quiz Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container my-4">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8 col-xl-7">
        <div class="card p-4 p-md-5">
          <div class="text-center mb-4">
            <h2 class="text-purple fw-bold mb-1">Create Account</h2>
            <p class="text-secondary small">Start your quiz journey today</p>
          </div>
          
          <form id="registerForm">
            <!-- Full Name -->
            <div class="mb-3">
              <label for="regName" class="form-label">Full Name</label>
              <input type="text" class="form-control" id="regName" placeholder="Enter full name" required>
            </div>

            <!-- Email / Account -->
            <div class="mb-3 position-relative">
              <label for="regEmail" class="form-label">Email / Account</label>
              <input type="email" class="form-control" id="regEmail" placeholder="username or username@domain.com" autocomplete="off" required>
              <div id="emailSuggestBox" class="position-absolute w-100 d-none mt-1 z-3"></div>
            </div>

            <!-- Password -->
            <div class="mb-3">
              <label for="regPassword" class="form-label">Password</label>
              <div class="input-group">
                <input type="password" class="form-control" id="regPassword" placeholder="Enter strong password" required>
                <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                  <i class="bi bi-eye-slash" id="toggleIcon"></i>
                </button>
              </div>
            </div>

            <!-- Password Info Box -->
            <div class="p-3 mb-3 rounded-3 pass-conditions">
              <span class="text-purple small fw-bold d-block mb-1">Password must contain:</span>
              <ul class="text-secondary small mb-0 ps-3">
                <li>At least 8 characters</li>
                <li>Letters & numbers/symbols</li>
              </ul>
            </div>

            <!-- Confirm Password -->
            <div class="mb-3">
              <label for="regConfirmPassword" class="form-label">Confirm Password</label>
              <div class="input-group">
                <input type="password" class="form-control" id="regConfirmPassword" placeholder="Repeat password" required>
                <button class="btn btn-outline-secondary" type="button" id="toggleConfirmPassword">
                  <i class="bi bi-eye-slash" id="toggleConfirmIcon"></i>
                </button>
              </div>
            </div>

            <!-- Terms Checkbox -->
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="termsCheck" required>
              <label class="form-check-label text-secondary small" for="termsCheck">
                I agree to Terms & Conditions
              </label>
            </div>

            <div id="regError" class="text-danger small mb-3 text-center"></div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-purple w-100 py-2.5 mb-3 fw-bold">Register Now</button>

            <div class="text-center">
              <span class="text-secondary small">Already registered? </span>
              <a href="index.html" class="text-purple text-decoration-none small fw-bold">Login here</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
