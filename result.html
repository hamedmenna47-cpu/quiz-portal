<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">
        <div class="card p-4 p-md-5 text-center">
          <div class="mb-3">
            <i class="bi bi-trophy-fill fs-1 text-purple"></i>
          </div>
          <h3 class="text-purple fw-bold mb-1">Assessment Complete</h3>
          <h6 class="text-secondary mb-4"><span id="resultName"></span></h6>

          <div id="passFailMessage" class="mb-4"></div>

          <div class="row g-3 mb-4">
            <div class="col-6">
              <div class="p-3 rounded-3 bg-dark border border-secondary">
                <span class="text-secondary small d-block mb-1">Score</span>
                <span class="fs-4 fw-bold text-purple"><span id="scoreDisplay"></span> / <span id="totalDisplay"></span></span>
              </div>
            </div>
            <div class="col-6">
              <div class="p-3 rounded-3 bg-dark border border-secondary">
                <span class="text-secondary small d-block mb-1">Percentage</span>
                <span class="fs-4 fw-bold text-success"><span id="percentageDisplay"></span>%</span>
              </div>
            </div>
          </div>

          <div class="text-start mb-4">
            <h6 class="text-purple fw-bold mb-2"><i class="bi bi-clock-history me-1"></i> Attempt History</h6>
            <ul id="historyList" class="list-group list-group-flush small"></ul>
          </div>

          <div class="d-grid gap-2">
            <button id="tryAgainBtn" class="btn btn-purple py-2">Retake Quiz</button>
            <button class="btn btn-outline-danger py-2" onclick="handleLogout()">Logout</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/result.js"></script>
</body>
</html>
